<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Megaphone / Ad Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Orange / Coral Accent Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Superellipse / Rounded Box -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Background Decorative Slanted News Sheet -->
  <g transform="rotate(7, 256, 256)" opacity="0.35">
    <rect x="135" y="105" width="245" height="300" rx="18" fill="#ffffff" />
  </g>

  <!-- Foreground Main Newspaper Sheet -->
  <g filter="url(#softGlow)">
    <rect x="110" y="115" width="245" height="300" rx="20" fill="#FFFFFF" />
    
    <!-- Paper Header Bar (Brand Green) -->
    <rect x="130" y="135" width="205" height="24" rx="6" fill="#059669" />
    <rect x="138" y="142" width="70" height="10" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="320" cy="147" r="4" fill="#ffffff" fill-opacity="0.9" />

    <!-- Newspaper Headline Mock -->
    <rect x="130" y="172" width="165" height="14" rx="4" fill="#1e293b" />
    <rect x="130" y="193" width="130" height="8" rx="3" fill="#64748b" />
    <rect x="130" y="206" width="145" height="8" rx="3" fill="#94a3b8" />
    <rect x="130" y="219" width="110" height="8" rx="3" fill="#cbd5e1" />

    <!-- Newspaper Ad Box 1 (Classified / Display Ad representation) -->
    <rect x="130" y="242" width="95" height="80" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" />
    <rect x="140" y="252" width="50" height="8" rx="3" fill="#059669" />
    <rect x="140" y="266" width="75" height="6" rx="2" fill="#34d399" />
    <rect x="140" y="277" width="65" height="6" rx="2" fill="#6ee7b7" />
    <rect x="140" y="288" width="40" height="16" rx="4" fill="#059669" />

    <!-- Column 2 Mock Content -->
    <rect x="238" y="242" width="97" height="8" rx="3" fill="#475569" />
    <rect x="238" y="255" width="97" height="6" rx="2" fill="#94a3b8" />
    <rect x="238" y="266" width="85" height="6" rx="2" fill="#cbd5e1" />
    <rect x="238" y="277" width="92" height="6" rx="2" fill="#cbd5e1" />
    <rect x="238" y="288" width="70" height="6" rx="2" fill="#94a3b8" />
    <rect x="238" y="299" width="80" height="6" rx="2" fill="#cbd5e1" />

    <!-- Bottom Feature Ad Banner -->
    <rect x="130" y="334" width="205" height="58" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
    <circle cx="152" cy="363" r="14" fill="#0d9488" />
    <path d="M 148 358 L 157 363 L 148 368 Z" fill="#ffffff" />
    <rect x="175" y="352" width="110" height="8" rx="3" fill="#0f172a" />
    <rect x="175" y="366" width="80" height="6" rx="2" fill="#0d9488" />
  </g>

  <!-- Dynamic Ad Megaphone / Loudspeaker Beacon Breaking Out -->
  <g transform="translate(265, 80) scale(1.15)" filter="url(#dropShadow)">
    <!-- Sonic Soundwaves -->
    <path d="M 98 42 C 108 52, 108 72, 98 82" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" />
    <path d="M 112 30 C 128 46, 128 78, 112 94" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <path d="M 126 18 C 148 40, 148 84, 126 106" fill="none" stroke="#FB7185" stroke-width="5" stroke-linecap="round" opacity="0.8" />

    <!-- Megaphone Cone -->
    <path d="M 40 45 L 85 24 C 88 23, 92 26, 92 30 L 92 94 C 92 98, 88 101, 85 100 L 40 79 Z" fill="url(#goldGrad)" />
    <!-- Megaphone Front Ring -->
    <ellipse cx="90" cy="62" rx="6" ry="36" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
    <!-- Megaphone Body / Chamber -->
    <rect x="18" y="47" width="26" height="30" rx="6" fill="#EA580C" />
    <!-- Handle -->
    <path d="M 28 77 L 24 102 C 23 105, 27 108, 30 106 L 40 96 L 38 77 Z" fill="#C2410C" />
    <!-- Megaphone Cap -->
    <circle cx="18" cy="62" r="10" fill="#BE123C" />
  </g>

  <!-- Little BD Flag Dot / Pride Badge (Red sun in emerald harmony) -->
  <circle cx="390" cy="385" r="32" fill="#E11D48" stroke="#FFFFFF" stroke-width="6" filter="url(#softGlow)" />
  <path d="M 382 386 L 388 392 L 400 378" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
